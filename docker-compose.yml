services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studenthub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: studenthub
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Local development value only. Set JWT_SECRET to your own value anywhere else.
      JWT_SECRET: ${JWT_SECRET:-c3R1ZGVudGh1Yi1qd3Qtc2VjcmV0LWtleS0yMDI0LWNoYW5nZS1pbi1wcm9k}
      STORAGE_DIR: /data/uploads
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  uploads:
